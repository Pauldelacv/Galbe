name: Deploy

# Publishes the studio to Cloudflare Pages. Configure in the repository settings:
#   secrets.CLOUDFLARE_API_TOKEN   (token with "Cloudflare Pages: Edit")
#   secrets.CLOUDFLARE_ACCOUNT_ID
#   vars.CLOUDFLARE_PAGES_PROJECT  (optional, defaults to "galbe")
# Without the secrets the workflow builds and skips the upload.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/studio/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'galbe' }} --branch=${{ github.ref_name }}
      - name: Skip notice
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Cloudflare secrets are not configured; the build succeeded but was not deployed."
